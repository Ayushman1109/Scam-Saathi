  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Shield Outer -->
  <path d="M256 64 L416 128 C416 290 348 392 256 448 C164 392 96 290 96 128 Z" fill="url(#shield)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.3))"/>
